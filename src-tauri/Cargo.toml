[package]
name = "baseio"
version = "0.1.0"
description = "BASEIO - Local AI Hub"
authors = ["BASEIO contributors"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows (cargo#8519).
name = "baseio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "macros", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Graphics_Dxgi", "Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
